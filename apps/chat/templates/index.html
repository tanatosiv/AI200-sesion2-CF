<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI-200 · Foundry Chat</title><style>body{background:#101827;color:#e9eef9;font:16px system-ui;margin:0}.wrap{max-width:780px;margin:60px auto;padding:20px}.box{background:#1a273b;border:1px solid #384760;border-radius:14px;padding:24px}textarea{width:100%;box-sizing:border-box;padding:14px;background:#0e1726;color:white;border:1px solid #6e819a;border-radius:8px;font:inherit}button{background:#64bcf6;color:#081523;padding:12px 24px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:14px}pre{white-space:pre-wrap;background:#0f1b2b;padding:16px;border-radius:8px;min-height:65px}small{color:#a6b9d0}</style></head><body><div class="wrap"><div class="box"><h1>AI-200 · Asistente de Azure</h1><small>Microsoft Foundry · Versión <strong id="edition">{{ edition }}</strong> · Azure App Service / Container Apps</small><p>Pregunta algo sobre contenedores, ACR o servicios de IA en Azure.</p><form id="form"><textarea id="q" rows="4" required maxlength="2000">¿Cuál es la diferencia entre Azure Container Registry y Azure Container Apps?</textarea><button id="send" type="submit">Consultar modelo real</button></form><h3>Respuesta</h3><pre id="answer">Aquí aparecerá la respuesta generada.</pre></div></div><script>document.querySelector('#form').addEventListener('submit',async(e)=>{e.preventDefault();let b=document.querySelector('#send');b.disabled=true;document.querySelector('#answer').textContent='Consultando Microsoft Foundry…';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#q').value})});let j=await r.json();document.querySelector('#answer').textContent=r.ok?j.answer:(j.detail||'Error de servicio');}catch(err){document.querySelector('#answer').textContent='Error de red: '+err.message;}finally{b.disabled=false}})</script></body></html>
